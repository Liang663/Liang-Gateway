server:
  port: 8080

spring:
  config:
    import: optional:file:./config/application-local.yml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        auto_quote_keyword: true
  data:
    redis:
      repositories:
        enabled: false

gateway:
  proxy:
    connect-timeout: 5s
    response-timeout: 120s
    max-in-memory-size: 16MB
  quota:
    key-prefix: gw:quota
  mcp:
    allowed-origins: []

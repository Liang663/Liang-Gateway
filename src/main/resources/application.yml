server:
  port: 8080

spring:
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    hikari:
      maximum-pool-size: 2
  data:
    redis:
      repositories:
        enabled: false

gateway:
  proxy:
    connect-timeout: 5s
    response-timeout: 120s
    max-in-memory-size: 16MB
  quota:
    key-prefix: gw:quota
  mcp:
    allowed-origins: []

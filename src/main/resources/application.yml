server:
  port: 8880

spring:
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    hikari:
      maximum-pool-size: 2
  # R2DBC disables JDBC DataSource auto-configuration. Flyway owns this startup-only JDBC connection.
  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  data:
    redis:
      repositories:
        enabled: false

gateway:
  proxy:
    connect-timeout: 5s
    response-timeout: 120s
    max-in-memory-size: 16MB
    max-connections: 4096
  quota:
    key-prefix: gw:quota
  mcp:
    allowed-origins: []

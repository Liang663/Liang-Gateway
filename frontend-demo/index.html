  function pageHead(title,subtitle,buttons=''){return `<div class="page-head"><div><div class="eyebrow">LIANG GATEWAY / CONSOLE</div><h1>${title}</h1><p>${subtitle}</p></div><div class="actions">${buttons}</div></div>`}

  function trendChart(){const p=periods[range],points=p.data.map((v,i)=>[40+i*25,178-v*1.7]),path=points.map((v,i)=>(i?'L':'M')+v.join(',')).join(' ');return `<svg class="trend" viewBox="0 0 670 225" role="img" aria-label="${p.label}模拟请求趋势，横轴时间，纵轴每小时请求数"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7bb9a1" stop-opacity=".24"/><stop offset="1" stop-color="#7bb9a1" stop-opacity="0"/></linearGradient></defs>${[32,80,128,176].map((y,i)=>`<line class="grid" x1="40" y1="${y}" x2="640" y2="${y}"/><text x="27" y="${y+3}" text-anchor="end">${[900,600,300,0][i]}</text>`).join('')}<path d="${path} L640,178 L40,178 Z" fill="url(#area)"/><path d="${path}" fill="none" stroke="#278f73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 173 L100 174 L150 172 L210 174 L275 169 L340 173 L390 168 L450 172 L510 169 L575 173 L640 171" fill="none" stroke="#c2a56b" stroke-width="1.5" stroke-dasharray="4 3"/>${p.axis.map((label,i)=>`<text x="${40+i*100}" y="205" text-anchor="middle">${label}</text>`).join('')}<text x="40" y="17">请求 / 小时（示例）</text></svg>`}
  function logTable(items){return `<div class="table-scroll"><table><thead><tr><th>请求时间</th><th>模型</th><th>访问令牌</th><th>状态</th><th>首内容耗时</th><th>Token 用量</th><th>费用</th><th><span class="sr-only">操作</span></th></tr></thead><tbody>${items.length?items.map(l=>`<tr><td class="mono muted">${l.time}</td><td><div class="model-cell"><span class="model-glyph ${l.model.startsWith('qwen')?'blue':''}">${l.model.startsWith('qwen')?'Q':'D'}</span>${l.model}<span class="badge neutral">${l.stream?'SSE':'JSON'}</span></div></td><td>${escapeHTML(l.token)}</td><td>${statusBadge(l.status)}</td><td class="mono">${l.ttft?l.ttft+' ms':'—'}</td><td class="mono">${l.tokens.toLocaleString()}</td><td class="mono">¥ ${l.cost.toFixed(4)}</td><td><button class="link-button" data-detail="${l.id}" aria-label="查看请求 ${l.id} 详情">${icon('arrow')}</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">没有匹配的请求，试试其他模型名称或状态。</td></tr>'}</tbody></table></div>`}
  function overview(){const p=periods[range];return pageHead('网关概览','每一次调用，都清晰可见。以下为 2026 年 9 月 18 日的演示快照。',`<button class="button" data-action="export">${icon('download')}导出示例日志</button><button class="button primary" data-action="playground">${icon('play')}发起模拟调用</button>`)+`<section class="metric-grid" aria-label="模拟指标">${[['请求总量',p.total,'次','pulse','↑ 12.8%','较上一周期'],['调用成功率',p.success,'%','check','↑ 0.24%','较上一周期'],['平均首内容耗时',p.ttft,'ms','clock','↓ 8.2%','较上一周期'],['模型消费','¥ '+p.cost,'','wallet','按实际 usage','计费口径示意']].map((m,i)=>`<div class="metric ${i===0?'metric-main':''}"><div class="metric-label">${p.label}${m[0]}${icon(m[3])}</div><div class="metric-value">${m[1]}<span class="unit">${m[2]}</span></div><div class="metric-note"><span class="positive">${m[4]}</span><span>${m[5]}</span></div><svg class="mini-chart" viewBox="0 0 70 30" aria-hidden="true"><path d="M1 27 9 22 15 25 23 12 30 18 38 15 46 19 53 8 60 12 69 3" fill="none" stroke="${i===2?'#adbd97':'#79ac93'}" stroke-width="1.6"/></svg></div>`).join('')}</section><div class="dashboard-row"><section class="panel"><div class="panel-head"><div><h2>调用趋势</h2><p class="panel-sub">观察流量变化与请求失败情况</p></div><div class="segmented" aria-label="趋势周期"><button data-range="24h" class="${range==='24h'?'active':''}" aria-pressed="${range==='24h'}">24 小时</button><button data-range="7d" class="${range==='7d'?'active':''}" aria-pressed="${range==='7d'}">7 天</button></div></div><div class="chart-caption"><span class="legend"><span class="legend-line"></span>请求量</span><span class="legend"><span class="legend-line orange"></span>失败请求</span></div><div class="chart-wrap">${trendChart()}</div></section><section class="panel"><div class="panel-head"><div><h2>模型调用分布</h2><p class="panel-sub">${p.label} · 按调用次数</p></div><button class="link-button" data-action="models" aria-label="查看模型">${icon('arrow')}</button></div><div class="model-distribution"><div class="donut" role="img" aria-label="DeepSeek Chat 54%，Reasoner 28%，Qwen Plus 14%，其他 4%"><div class="donut-label"><strong>${p.total}</strong><span>总调用次数</span></div></div><div class="distribution-list">${[['DeepSeek Chat','54','#198971'],['Reasoner','28','#79b598'],['Qwen Plus','14','#c3d8bc'],['其他','4','#e1e8dc']].map(a=>`<div class="distribution-item"><span class="swatch" style="background:${a[2]}"></span><span>${a[0]}</span><strong>${a[1]}%</strong></div>`).join('')}</div></div></section></div><div class="dashboard-row"><section class="panel quota-panel"><div class="panel-head"><div><h2>令牌额度</h2><p class="panel-sub">5 小时窗口 · 金额消耗</p></div><span class="quota-head-note">1 个令牌接近额度上限</span></div><div class="quota-list">${tokens.slice(0,3).map(t=>`<div class="quota-row"><div><div class="token-name"><span class="dot" style="background:${t.used/t.cap>.8?'#c1a15d':'#71a790'}"></span>${escapeHTML(t.name)}</div><div class="subtext mono">${t.code}</div></div><div><div class="progress-label"><span>已使用</span><span>${Math.round(t.used/t.cap*100)}%</span></div><div class="track"><div class="fill ${t.used/t.cap>.8?'warn':''}" style="width:${Math.min(t.used/t.cap*100,100)}%"></div></div></div><div class="quota-value">¥ ${t.used.toFixed(2)} <span class="muted">/ ${t.cap.toFixed(2)}</span><div class="subtext">QPM 上限 ${t.qpm}</div></div></div>`).join('')}</div></section><section class="shortcut"><span class="tag">CONNECT YOUR TOOLS</span><h2>让已有接口，<br>成为智能体的工具。</h2><p>从 OpenAPI 描述到 MCP 工具，<br>统一管理服务、参数与调用。</p><button class="button" data-action="import">导入 OpenAPI 示例 ${icon('arrow')}</button></section></div><section class="panel table-panel"><div class="panel-head"><div><h2>最近调用</h2><p class="panel-sub">用量、延迟与结果，一目了然</p></div><button class="link-button" data-action="logs">查看全部 ${icon('arrow')}</button></div>${logTable(logs.slice(0,5))}<div class="table-footer"><span>显示最近 5 条演示记录</span><span>快照时间 14:32:08 · UTC+8</span></div></section>`}
  function modelView(){const filtered=models.filter(m=>(m.name+' '+m.provider).toLowerCase().includes(modelQuery.toLowerCase()));return pageHead('模型管理','集中查看模型目录、计费配置与可用状态。',`<button class="button primary" data-action="add-model">${icon('plus')}登记模型</button>`)+`<div class="toolbar"><div class="search">${icon('search')}<input id="modelSearch" aria-label="搜索模型" placeholder="搜索模型名称、提供方…" value="${escapeHTML(modelQuery)}"></div><span class="muted" style="font-size:11px">${models.length} 个模型 · ${models.filter(m=>m.enabled).length} 个已启用</span></div><div class="note">以下模型、价格与凭据关联均为演示配置，不代表提供方实际定价。</div><section class="cards">${filtered.length?filtered.map(m=>{const i=models.indexOf(m);return `<article class="panel item-card"><div class="card-top"><div><span class="card-icon">${m.glyph}</span><h3>${escapeHTML(m.name)}</h3><p>${escapeHTML(m.provider)} · OpenAI 兼容接口</p></div><span class="badge ${m.enabled?'':'neutral'}">${m.enabled?'已启用':'已停用'}</span></div><div><div class="data-pair"><span>输入 / 百万 Token</span><strong>¥ ${m.input}</strong></div><div class="data-pair"><span>输出 / 百万 Token</span><strong>¥ ${m.output}</strong></div><div class="data-pair"><span>上游凭据</span><span class="mono">key_demo_••••</span></div></div><div class="card-bottom"><button class="link-button" data-test-model="${i}">前往调试 ${icon('arrow')}</button><button class="switch" role="switch" aria-label="启用 ${escapeHTML(m.name)}" aria-checked="${m.enabled}" data-toggle-model="${i}"></button></div></article>`}).join(''):'<div class="panel empty">没有找到匹配的模型。</div>'}</section>`}
  function tokenView(){return pageHead('令牌与额度','让每个调用方拥有明确的访问范围与消费预算。',`<button class="button primary" data-action="add-token">${icon('plus')}创建演示令牌</button>`)+`<div class="note">模拟工作空间 · 展示 QPM、5 小时和周周期额度。这里只变更本页内存，不会创建真实凭据。</div><section class="cards">${tokens.map((t,i)=>`<article class="panel item-card"><div class="card-top"><div><span class="card-icon">${icon('key')}</span><h3>${escapeHTML(t.name)}</h3><p>${escapeHTML(t.owner)} · ${t.code}</p></div><span class="badge ${t.enabled?'':'neutral'}">${t.enabled?'使用中':'已停用'}</span></div><div>${[['5 小时额度',t.used,t.cap],['周周期额度',t.week,t.weekCap]].map(q=>`<div style="margin-bottom:16px"><div class="progress-label"><span>${q[0]}</span><span>¥ ${q[1].toFixed(2)} / ${q[2]}</span></div><div class="track"><div class="fill ${q[1]/q[2]>.8?'warn':''}" style="width:${Math.min(q[1]/q[2]*100,100)}%"></div></div></div>`).join('')}<div class="data-pair"><span>QPM 上限</span><strong>${t.qpm} 次 / 分钟</strong></div><div class="data-pair"><span>允许模型</span><span>DeepSeek · Qwen</span></div></div><div class="card-bottom"><button class="link-button" data-reset-token="${i}">重置演示额度</button><button class="switch" role="switch" aria-label="启用令牌 ${escapeHTML(t.name)}" aria-checked="${t.enabled}" data-toggle-token="${i}"></button></div></article>`).join('')}</section>`}
  function mcpView(){return pageHead('MCP 工具','把业务接口连接到智能体，统一管理工具的发现与调用。',`<button class="button primary" data-action="import">${icon('plus')}导入 OpenAPI</button>`)+`<div class="toolbar"><span class="badge">无状态调用</span><span class="muted" style="font-size:11px">${services.length} 个服务 · ${services.reduce((n,s)=>n+s.tools.length,0)} 个工具 · 服务地址均为示意</span></div><section class="cards">${services.map((s,i)=>`<article class="panel item-card"><div class="card-top"><div><span class="card-icon">${icon('plug')}</span><h3>${escapeHTML(s.name)}</h3><p>${escapeHTML(s.description)}</p></div><span class="badge">已启用</span></div><div><div class="endpoint mono">POST /mcp/${escapeHTML(s.path)}</div><div class="service-feature"><span>${s.tools.length} 个工具</span><span>JSON-RPC 2.0</span></div><div class="service-tools">${s.tools.map(t=>`<span class="mono">${escapeHTML(t)}</span>`).join('')}</div></div><div class="card-bottom"><button class="link-button" data-service="${i}">查看工具定义 ${icon('arrow')}</button><button class="button" data-action="mcp-playground">模拟调用</button></div></article>`).join('')}</section><div class="note" style="margin-top:24px">接入路径：OpenAPI 导入 → 参数 Schema → tools/list 发现 → tools/call → HTTP 出站。演示页不会向业务系统发送请求。</div>`}
  function filteredLogs(){return logs.filter(l=>(logStatus==='all'||String(l.status)===logStatus)&&(l.model+' '+l.token+' '+l.id).toLowerCase().includes(logQuery.toLowerCase()))}
  function logsView(){return pageHead('调用日志','从单次请求追踪模型、用量、费用与错误。',`<button class="button" data-action="export">${icon('download')}导出筛选结果</button>`)+`<div class="toolbar"><div class="search">${icon('search')}<input id="logSearch" aria-label="搜索调用日志" placeholder="搜索模型、令牌或 request ID…" value="${escapeHTML(logQuery)}"></div><select id="logStatus" aria-label="按请求状态筛选">${[['all','全部状态'],['200','200 · 成功'],['429','429 · 限流'],['504','504 · 超时']].map(a=>`<option value="${a[0]}" ${logStatus===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select><span class="muted" style="font-size:11px">2026-09-18 · 示例快照</span></div><section class="panel table-panel"><div id="logTable">${logTable(filteredLogs())}</div><div class="table-footer"><span id="logCount">共 ${filteredLogs().length} 条示例记录</span><span>金额单位：人民币元</span></div></section>`}
  function playView(){return pageHead('调试台','在接入真实服务前，先体验一次调用的完整交互。')+`<div class="note">这是本地交互模拟：响应由演示页生成，不会发送网络请求，不产生费用。请勿输入真实密钥或敏感数据。</div><div class="toolbar"><div class="segmented"><button data-mode="chat" class="${playMode==='chat'?'active':''}" aria-pressed="${playMode==='chat'}">Chat / SSE</button><button data-mode="mcp" class="${playMode==='mcp'?'active':''}" aria-pressed="${playMode==='mcp'}">MCP 工具</button></div></div><div class="two-cols"><section class="panel workspace-panel"><h2 style="margin-bottom:22px">${playMode==='chat'?'构建模型请求':'构建工具请求'}</h2><form id="playForm">${playMode==='chat'?`<div class="field"><label for="playModel">模型</label><select id="playModel">${models.filter(m=>m.enabled).map(m=>`<option>${escapeHTML(m.name)}</option>`).join('')}</select></div><div class="field"><label for="prompt">消息内容</label><textarea id="prompt" required maxlength="2000">用一句话介绍 Liang Gateway 能做什么。</textarea></div><div class="endpoint mono">POST /v1/chat/completions · stream: true</div>`:`<div class="field"><label for="playTool">工具</label><select id="playTool">${services.flatMap(s=>s.tools.map(t=>`<option value="${escapeHTML(t)}">${escapeHTML(s.name+' / '+t)}</option>`)).join('')}</select></div><div class="field"><label for="arguments">调用参数（JSON 对象）</label><textarea id="arguments" class="mono" required>{"orderId": "DEMO-20260918"}</textarea></div><div class="endpoint mono">JSON-RPC · tools/call</div>`}<div class="actions" style="margin-top:22px"><button class="button primary" id="sendButton" type="submit">${icon('play')}开始模拟</button><button class="button" id="stopButton" type="button" disabled>停止输出</button></div></form></section><section class="panel workspace-panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px"><h2>响应预览</h2><span class="badge neutral" id="playStatus">等待模拟</span></div><div id="playResult" class="${playMode==='chat'?'play-result':'terminal'}">${playMode==='chat'?'发送一条消息，查看流式内容如何逐步到达。':'// 执行后将在这里展示模拟工具结果'}</div><div class="result-meta" id="playMeta"><span>无真实请求</span><span>费用 ¥ 0.00</span></div></section></div>`}
  function render(){main.innerHTML=({overview,models:modelView,tokens:tokenView,mcp:mcpView,logs:logsView,playground:playView}[route])()+footer();bindInputs()}
  function bindInputs(){const logSearch=document.getElementById('logSearch');if(logSearch)logSearch.addEventListener('input',e=>{logQuery=e.target.value;updateLogs()});const status=document.getElementById('logStatus');if(status)status.addEventListener('change',e=>{logStatus=e.target.value;updateLogs()});const modelSearch=document.getElementById('modelSearch');if(modelSearch)modelSearch.addEventListener('input',e=>{const pos=e.target.selectionStart;modelQuery=e.target.value;render();const input=document.getElementById('modelSearch');input.focus();input.setSelectionRange(pos,pos)});const form=document.getElementById('playForm');if(form)form.addEventListener('submit',simulate);const stop=document.getElementById('stopButton');if(stop)stop.addEventListener('click',()=>finishStream(true))}
  function updateLogs(){document.getElementById('logTable').innerHTML=logTable(filteredLogs());document.getElementById('logCount').textContent=`共 ${filteredLogs().length} 条示例记录`}
  function showDetail(id){const l=logs.find(item=>item.id===id);openDialog('请求详情',`<span class="mono muted">${l.id} · 2026-09-18 ${l.time}</span><div class="log-detail-grid">${[['模型',l.model],['访问令牌',l.token],['状态',l.status===200?'200 · 成功':l.status===429?'429 · QPM 超限':'504 · 上游超时'],['响应类型',l.stream?'SSE 流式':'JSON'],['总耗时',l.duration+' ms'],['Token 用量',l.tokens],['首内容耗时',l.ttft?l.ttft+' ms':'未记录'],['消费金额','¥ '+l.cost.toFixed(4)]].map(a=>`<div class="detail-item"><small>${a[0]}</small><strong>${escapeHTML(a[1])}</strong></div>`).join('')}</div><div class="terminal" style="min-height:auto">${escapeHTML(JSON.stringify({requestId:l.id,model:l.model,stream:l.stream,result:l.status===200?'completed':l.status===429?'quota_exceeded':'upstream_timeout',demo:true},null,2))}</div><p class="panel-sub" style="margin-top:14px">示例日志仅供界面演示，不包含真实会话或密钥。</p>`)}
  function exportLogs(){const rows=route==='logs'?filteredLogs():logs;const csvCell=v=>'"'+String(v).replace(/^([=+@\-])/,'\t$1').replaceAll('"','""')+'"';const csv='\uFEFF'+[['request_id','time','model','token','status','tokens','cost_cny'],...rows.map(l=>[l.id,l.time,l.model,l.token,l.status,l.tokens,l.cost])].map(r=>r.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='liang-gateway-demo-logs.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 ${rows.length} 条模拟日志`)}
  function addModel(){openDialog('登记演示模型',`<form id="addModelForm"><div class="note">仅添加到此页面，不保存真实 API Key。</div><div class="field"><label for="modelName">模型名称</label><input id="modelName" placeholder="例如 demo-chat" required maxlength="64"></div><div class="field"><label for="modelProvider">提供方</label><input id="modelProvider" value="自定义提供方" required maxlength="40"></div><div class="two-cols"><div class="field"><label for="inputPrice">输入价格 / 百万 Token（元）</label><input id="inputPrice" type="number" min="0" max="10000" step=".01" value="2.00" required></div><div class="field"><label for="outputPrice">输出价格 / 百万 Token（元）</label><input id="outputPrice" type="number" min="0" max="10000" step=".01" value="3.00" required></div></div><div class="dialog-actions"><button class="button" type="button" data-close>取消</button><button class="button primary">添加到演示</button></div></form>`);document.getElementById('addModelForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('modelName').value.trim(),provider=document.getElementById('modelProvider').value.trim();if(!name||!provider)return toast('请输入模型名称与提供方');if(models.some(m=>m.name===name))return toast('模型名称已存在');models.push({name,provider,glyph:name[0].toUpperCase(),input:Number(document.getElementById('inputPrice').value).toFixed(2),output:Number(document.getElementById('outputPrice').value).toFixed(2),enabled:true});dialog.close();modelQuery='';navigate('models');toast('演示模型已添加，刷新页面后恢复')}}
  function addToken(){openDialog('创建演示令牌',`<form id="addTokenForm"><div class="note">只生成演示条目，不生成可用于鉴权的密钥。</div><div class="field"><label for="tokenName">令牌名称</label><input id="tokenName" required maxlength="32" placeholder="例如 客服助手"></div><div class="two-cols"><div class="field"><label for="qpm">QPM 上限</label><input id="qpm" type="number" value="60" min="1" max="10000" step="1" required></div><div class="field"><label for="budget">5 小时额度（元）</label><input id="budget" type="number" value="50" min="1" max="100000" required></div></div><div class="dialog-actions"><button class="button" type="button" data-close>取消</button><button class="button primary">创建演示条目</button></div></form>`);document.getElementById('addTokenForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('tokenName').value.trim();if(!name)return toast('请输入令牌名称');const cap=Number(document.getElementById('budget').value);tokens.push({name,owner:'开发者',code:'at_demo_••••new',qpm:Number(document.getElementById('qpm').value),used:0,cap,week:0,weekCap:cap*10,enabled:true});dialog.close();navigate('tokens');toast('演示令牌已创建')}}
  const sampleOpenAPI={openapi:'3.0.0',info:{title:'库存服务',version:'1.0.0'},servers:[{url:'https://inventory.example.com'}],paths:{'/inventory/{sku}':{get:{operationId:'getInventory',summary:'查询商品库存',parameters:[{name:'sku',in:'path',required:true,schema:{type:'string'}}]}}}};
  function importAPI(){openDialog('导入 OpenAPI 示例',`<form id="importForm"><div class="note">本页仅演示识别路径与工具名称；不会执行后端完整的引用解析、校验或导入。</div><div class="field"><label for="apiDocument">OpenAPI / Swagger JSON</label><textarea id="apiDocument" class="mono" style="min-height:270px" required>${escapeHTML(JSON.stringify(sampleOpenAPI,null,2))}</textarea></div><div class="dialog-actions"><button class="button" type="button" data-close>取消</button><button class="button primary">生成演示工具</button></div></form>`);document.getElementById('importForm').onsubmit=e=>{e.preventDefault();try{const doc=JSON.parse(document.getElementById('apiDocument').value);if(!doc||!doc.paths||typeof doc.paths!=='object'||Array.isArray(doc.paths))throw Error('请提供有效的 paths 对象');const tools=[];for(const[path,ops]of Object.entries(doc.paths)){if(!ops||typeof ops!=='object')continue;for(const method of ['get','post','put','delete']){if(ops[method]&&typeof ops[method]==='object')tools.push(String(ops[method].operationId||method+'_'+path.replace(/[^a-z0-9]/gi,'_')))}}if(!tools.length)throw Error('未发现 GET / POST / PUT / DELETE 操作');if(new Set(tools).size!==tools.length)throw Error('工具名称重复，请检查 operationId');services.push({name:String(doc.info?.title||'导入服务'),path:'imported-'+(services.length+1),description:'由 OpenAPI 示例生成的本地演示条目。',tools,enabled:true});dialog.close();navigate('mcp');toast(`已生成 ${tools.length} 个演示工具`)}catch(error){toast(error instanceof SyntaxError?'JSON 格式有误，请检查后重试':error.message)}}}
  function serviceDetail(index){const s=services[index];openDialog(s.name+' · 工具目录',`<div class="endpoint mono">POST /mcp/${escapeHTML(s.path)}</div><p class="panel-sub" style="margin:16px 0">工具名称来自示例配置；下方 Schema 为展示样例。</p>${s.tools.map((name,i)=>`<div style="padding:13px 0;border-top:1px solid var(--line)"><strong class="mono">${escapeHTML(name)}</strong><div class="panel-sub">${i===0?'主工具':'关联工具'} · 可通过 tools/call 调用</div></div>`).join('')}<div class="terminal" style="min-height:auto;margin-top:15px">${escapeHTML(JSON.stringify({name:s.tools[0],inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id']},demo:true},null,2))}</div>`)}
  function simulate(e){e.preventDefault();if(playMode==='mcp'){try{const args=JSON.parse(document.getElementById('arguments').value);if(!args||Array.isArray(args)||typeof args!=='object')throw Error();const tool=document.getElementById('playTool').value;document.getElementById('playResult').textContent=JSON.stringify({jsonrpc:'2.0',id:'demo-001',result:{content:[{type:'text',text:JSON.stringify({tool,arguments:args,message:'模拟执行成功，未调用真实业务接口'})}],isError:false,resultType:'complete'},demo:true},null,2);document.getElementById('playStatus').textContent='模拟完成';document.getElementById('playStatus').className='badge';document.getElementById('playMeta').innerHTML='<span>本地生成 · 无网络请求</span><span>费用 ¥ 0.00</span>'}catch{toast('调用参数必须是有效的 JSON 对象')}return}if(!document.getElementById('playModel').value)return toast('请先启用一个模型');if(!document.getElementById('prompt').value.trim())return toast('请输入消息内容');const result=document.getElementById('playResult');result.textContent='';const output='Liang Gateway 为大模型和智能体提供统一入口，整合模型调用、SSE 流式转发、令牌额度控制，以及 HTTP 到 MCP 的工具转换。\n\n这段文字由 HTML 演示页在本地逐步输出，用来展示流式交互效果；没有请求模型，也没有产生费用。';let pos=0;document.getElementById('sendButton').disabled=true;document.getElementById('stopButton').disabled=false;document.getElementById('playStatus').textContent='模拟输出中';document.getElementById('playStatus').className='badge';streamTimer=setInterval(()=>{pos+=3;result.textContent=output.slice(0,pos);if(pos>=output.length)finishStream(false)},35)}
  function finishStream(stopped){clearInterval(streamTimer);streamTimer=null;const send=document.getElementById('sendButton');if(!send)return;send.disabled=false;document.getElementById('stopButton').disabled=true;document.getElementById('playStatus').textContent=stopped?'模拟已停止':'模拟完成';document.getElementById('playMeta').innerHTML='<span>纯前端打字效果 · 非真实性能数据</span><span>费用 ¥ 0.00</span>'}
  document.getElementById('navigation').innerHTML=navItems.map((n,i)=>`<button class="nav-item ${i===0?'active':''} ${i===5?'nav-gap':''}" data-nav="${n[0]}" ${i===0?'aria-current="page"':''}>${icon(n[1])}<span>${n[2]}</span>${n[0]==='mcp'?'<span class="count">MCP</span>':''}</button>`).join('');
  document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el)return;if(el.hasAttribute('data-close'))return dialog.close();if(el.dataset.nav)return navigate(el.dataset.nav);if(el.dataset.range){range=el.dataset.range;return render()}if(el.dataset.detail)return showDetail(el.dataset.detail);if(el.dataset.mode){if(streamTimer)clearInterval(streamTimer);streamTimer=null;playMode=el.dataset.mode;return render()}if(el.dataset.toggleModel!==undefined){const m=models[Number(el.dataset.toggleModel)];m.enabled=!m.enabled;render();return toast('模型状态已在演示页中更新')}if(el.dataset.toggleToken!==undefined){const t=tokens[Number(el.dataset.toggleToken)];t.enabled=!t.enabled;render();return toast('令牌状态已在演示页中更新')}if(el.dataset.resetToken!==undefined){const index=Number(el.dataset.resetToken);openDialog('重置演示额度',`<p>将“${escapeHTML(tokens[index].name)}”的 5 小时和周周期模拟用量归零。此操作不会影响真实额度。</p><div class="dialog-actions"><button class="button" data-close>取消</button><button class="button primary" id="confirmReset">确认重置</button></div>`);document.getElementById('confirmReset').onclick=()=>{tokens[index].used=0;tokens[index].week=0;dialog.close();render();toast('演示用量已归零')};return}if(el.dataset.testModel!==undefined){const m=models[Number(el.dataset.testModel)];if(!m.enabled)return toast('请先启用该模型，再进行模拟调试');playMode='chat';navigate('playground');document.getElementById('playModel').value=m.name;return}if(el.dataset.service!==undefined)return serviceDetail(Number(el.dataset.service));const action=el.dataset.action;if(['models','tokens','logs','playground'].includes(action))return navigate(action);if(action==='mcp-playground'){playMode='mcp';return navigate('playground')}if(action==='export')return exportLogs();if(action==='add-model')return addModel();if(action==='add-token')return addToken();if(action==='import')return importAPI()});
  document.getElementById('menuButton').onclick=()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('backdrop').classList.toggle('visible',open);document.getElementById('menuButton').setAttribute('aria-expanded',String(open))};
  document.getElementById('backdrop').onclick=closeNav;document.getElementById('closeDialog').onclick=()=>dialog.close();
  document.getElementById('helpButton').onclick=()=>openDialog('关于这个演示',`<div class="note">Liang Gateway 管理控制台 · HTML 交互原型</div><p>可以查看趋势、筛选日志、管理模拟模型和令牌，体验 OpenAPI 导入与流式调用。</p><p class="panel-sub" style="margin-top:14px;line-height:1.9">所有数据均为演示，不读取后端、不调用外部 API、不保存真实密钥。变更仅保留在页面内存中，刷新即恢复。部分聚合指标用于布局示意，后续接入时需要对应统计接口。</p>`);
  render();
  </script>
